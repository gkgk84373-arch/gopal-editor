# Gopal Editor: every push to main -> APK signed with the FIXED debug key in the repo
# (app/debug.keystore) + GitHub Release + version.json, so the in-app Updates tab always works
# and every build installs over the previous one without uninstalling.
#
# Optional: if you add these 4 secrets, a separately signed RELEASE apk is attached as well
# (gopal-editor-release.apk). The Updates tab keeps using the debug-key apk.
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Keep this repo PRIVATE: anyone with app/debug.keystore can sign an "update" for this app.
name: Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # create releases + upload assets

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the committed debug key
        run: |
          if [ ! -f app/debug.keystore ]; then
            echo "::error::app/debug.keystore is missing. Create it (README: Termux keytool command) and commit it with: git add -f app/debug.keystore"
            exit 1
          fi
          keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Version numbers
        run: |
          VC=$(( ${{ github.run_number }} + 1 ))          # versionCode: run number + 1 (always increases, same as before)
          VN="1.1.${{ github.run_number }}"
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "TAG=v$VN" >> "$GITHUB_ENV"
          echo "Building $VN ($VC)"

      - name: Build debug APK (fixed key) + unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest --tests 'com.gopal.editor.*Test' \
            -PappVersionCode="$VERSION_CODE" -PappVersionName="$VERSION_NAME" \
            -PupdateRepo="${{ github.repository }}"

      - name: Re-sign v1 + v2 + v3 with the same debug key, and verify
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks app/debug.keystore --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out gopal-editor.apk app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify -v --print-certs gopal-editor.apk

      - name: Optional release-key APK (only if the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "No release secrets: skipping the release-key APK (the debug-key APK above is the one users install)."
            exit 0
          fi
          ./gradlew --no-daemon assembleRelease \
            -PappVersionCode="$VERSION_CODE" -PappVersionName="$VERSION_NAME" -PupdateRepo="${{ github.repository }}"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KP_VAR=KEY_PASSWORD; [ -z "$KEY_PASSWORD" ] && KP_VAR=KEYSTORE_PASSWORD
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass "env:$KP_VAR" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out gopal-editor-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify gopal-editor-release.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Write version.json
        run: |
          LOG="$(git log -1 --pretty=%B)"
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/gopal-editor.apk" \
            --arg log "$LOG" \
            '{versionCode: $code, versionName: $name, apkUrl: $url, changelog: $log}' > version.json
          cat version.json

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="gopal-editor.apk version.json"
          [ -f gopal-editor-release.apk ] && FILES="$FILES gopal-editor-release.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "Gopal Editor $VERSION_NAME" --notes "$(git log -1 --pretty=%B)" --latest
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gopal-editor-${{ env.VERSION_NAME }}
          path: |
            gopal-editor*.apk
            version.json
