# Gopal Editor: हर push पर debug APK + GitHub Release + version.json
# कोई secret नहीं चाहिए (signing बाद में जोड़ेंगे)
name: Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version numbers
        run: |
          VC=$(( ${{ github.run_number }} + 1 ))
          VN="1.0.${{ github.run_number }}"
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "TAG=v$VN" >> "$GITHUB_ENV"
          echo "Building $VN ($VC)"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            -PappVersionCode="$VERSION_CODE" -PappVersionName="$VERSION_NAME" \
            -PupdateRepo="${{ github.repository }}"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk gopal-editor.apk

      - name: Write version.json
        run: |
          LOG="$(git log -1 --pretty=%B)"
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/gopal-editor.apk" \
            --arg log "$LOG" \
            '{versionCode: $code, versionName: $name, apkUrl: $url, changelog: $log}' > version.json
          cat version.json

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" gopal-editor.apk version.json --clobber
          else
            gh release create "$TAG" gopal-editor.apk version.json \
              --title "Gopal Editor $VERSION_NAME" --notes "$(git log -1 --pretty=%B)" --latest
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gopal-editor-${{ env.VERSION_NAME }}
          path: |
            gopal-editor.apk
            version.json
