org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=35

# ---- Gopal Editor build knobs (CI overrides them with -P...) ----
# GitHub "owner/repo" whose latest Release holds version.json. THE one place to change it.
# GitHub Actions passes -PupdateRepo=${{ github.repository }} automatically.
updateRepo=GITHUB_USERNAME/GopalEditor
appVersionCode=1
appVersionName=1.0.0
